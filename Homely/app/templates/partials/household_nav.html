{% macro household_nav(active_page='') %}
<!-- Mobile topbar -->
<header class="mobile-topbar">
  <div class="topbar-logo">
    <span
      class="dot"
      style="
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
      "
    ></span>
    HomeQuest
  </div>
  <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- Sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="d-flex">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span class="dot"></span> HomeQuest</div>

    <a
      class="nav-item-custom {% if active_page == 'dashboard' %}active{% endif %}"
      href="{{ url_for('index') }}"
    >
      <i data-lucide="layout-dashboard"></i> Dashboard
    </a>
    <a
      class="nav-item-custom {% if active_page == 'tasks' %}active{% endif %}"
      href="#"
    >
      <i data-lucide="circle-check"></i> Add Tasks
    </a>
    <a
      class="nav-item-custom {% if active_page == 'rewards' %}active{% endif %}"
      href="{{ url_for('rewards') }}"
    >
      <i data-lucide="gift"></i> Rewards
    </a>
    <a
      class="nav-item-custom {% if active_page == 'leaderboard' %}active{% endif %}"
      href="#"
    >
      <i data-lucide="trophy"></i> Leaderboard
    </a>

    <div class="nav-section-label">Account</div>
    <a
      class="nav-item-custom {% if active_page == 'profile' %}active{% endif %}"
      href="{{ url_for('edit_profile') }}"
    >
      <i data-lucide="user"></i> Profile
    </a>
    <a
      class="nav-item-custom {% if active_page == 'settings' %}active{% endif %}"
      href="#"
    >
      <i data-lucide="settings"></i> Settings
    </a>
  </nav>
  {% endmacro %}
