{% macro household_nav(active_page='') %}
<!-- Mobile topbar -->
<header class="mobile-topbar">
  <img class="topbar-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="Homely"/>
  <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- Sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="d-flex">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <img class="sidebar-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="Homely"/>

    <a
      class="nav-item-custom {% if active_page == 'dashboard' %}active{% endif %}"
      href="{{ url_for('main.home') }}"
    >
      <i data-lucide="layout-dashboard"></i> Dashboard
    </a>
    <a
      class="nav-item-custom {% if active_page == 'my_tasks' %}active{% endif %}"
      href="{{ url_for('main.my_tasks') }}"
    >
      <i data-lucide="clipboard-list"></i> My Tasks
    </a>
    <a
      class="nav-item-custom {% if active_page == 'rewards' %}active{% endif %}"
      href="{{ url_for('main.rewards') }}"
    >
      <i data-lucide="gift"></i> Rewards
    </a>
    <a
      class="nav-item-custom {% if active_page == 'leaderboard' %}active{% endif %}"
      href="{{ url_for('main.leaderboard') }}"
    >
      <i data-lucide="trophy"></i> Leaderboard
    </a>

    <div class="nav-section-label">Account</div>
    <a
      class="nav-item-custom {% if active_page == 'profile' %}active{% endif %}"
      href="{{ url_for('main.edit_profile') }}"
    >
      <i data-lucide="user"></i> Profile
    </a>
    <a
      class="nav-item-custom {% if active_page == 'settings' %}active{% endif %}"
      href="{{ url_for('main.manage_household') }}"
    >
      <i data-lucide="settings"></i> Settings
    </a>
  </nav>

<script src="{{ url_for('static', filename='js/navbar.js') }}"></script>

{% endmacro %}
