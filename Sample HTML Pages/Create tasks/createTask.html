<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Homepage</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="createTask.css"/>
    </head>
    <body>
        <div id="input-field">
            <label>Task description:</label>
            <input type="text"><br>
            <label>Task points:</label>
            <input type="number" min="0"><br>
            <button id="addSubtask">Add subtask</button>
            <button id="removeSubtask">Remove subtask</button>
            <p>Subtask descriptions: </p>
        </div> 
        <button id="submitTask">Submit</button>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="createTask.js"></script>
    </body>
</html>
